appId: app.resenha.desktop
productName: Resenha
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# só português e inglês: deixa o instalador menor
electronLanguages:
  - pt-BR
  - en-US
# Atualização automática (Windows): gera latest.yml + .blockmap ao lado do instalador.
# O endereço real vem do VITE_SERVER_URL (src/main/updater.ts); este é só para o builder.
publish:
  provider: generic
  url: https://localhost/api/updates
win:
  target: nsis
  # fundo branco com cantos arredondados (barra de tarefas, atalho, instalador)
  icon: resources/icon-win.png
  artifactName: Resenha-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Resenha
# macOS: só Apple Silicon (M1/M2/M3...). Precisa rodar num Mac (ou no GitHub Actions).
# Sem conta paga da Apple: assinatura ad-hoc, sem notarização.
mac:
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.png
  category: public.app-category.social-networking
  artifactName: Resenha-${version}-mac-arm64.${ext}
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: O Resenha usa o microfone para as chamadas de voz.
    NSCameraUsageDescription: O Resenha usa a câmera para as chamadas de vídeo.
    NSAudioCaptureUsageDescription: O Resenha captura o áudio do sistema ao compartilhar a tela.
dmg:
  artifactName: Resenha-${version}-mac-arm64.${ext}

# LiveKit para o modo Cloudflare (servidor em casa, sem portas abertas).
# As chaves vêm da variável LIVEKIT_KEYS (definida no docker-compose a partir do .env).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  # Sem portas abertas o LiveKit não consegue validar o próprio IP público e deixaria de anunciá-lo.
  skip_external_ip_validation: true
  # Anuncia também o IP da rede local: quem está na mesma casa do servidor conecta direto,
  # sem passar pelo Cloudflare — e a transmissão dessa pessoa não gasta o upload da internet.
  advertise_internal_ip: true
  # Só anuncia endereços da rede de casa. Sem isso ele também usa as redes internas do Docker
  # (172.17.x, 172.18.x) e às vezes associa o IP público a uma delas em vez da interface real —
  # aí o TURN do Cloudflare não alcança o servidor e a voz fica em "Conectando…".
  # IPv6 também fica de fora: o TURN do Cloudflare retransmite por IPv4.
  ips:
    includes:
      - 192.168.0.0/16
      - 10.0.0.0/8
  # Em congestionamento, reduz a qualidade em vez de pausar o vídeo (pausar = imagem congelada).
  congestion_control:
    enabled: true
    allow_pause: false
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info

# As chaves vêm da variável LIVEKIT_KEYS (definida no docker-compose a partir do .env)
port: 7880
rtc:
  tcp_port: 7881
  # Toda a mídia por UDP numa porta só (em vez de um range): uma regra só no firewall da cloud.
  udp_port: 7882
  use_external_ip: true
  # Em clouds com NAT 1:1 (Oracle, AWS: a VM só enxerga o IP privado) a validação do IP público
  # pode falhar, e aí o LiveKit deixaria de anunciá-lo e ninguém de fora conectaria.
  skip_external_ip_validation: true
  # Em congestionamento, reduz a qualidade em vez de pausar o vídeo (pausar = imagem congelada).
  congestion_control:
    enabled: true
    allow_pause: false
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
